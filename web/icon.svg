<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed square: iOS and maskable launchers crop their own shape.
       The bean stays inside the central 80% maskable safe zone. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2e2016"/>
      <stop offset="1" stop-color="#14110f"/>
    </radialGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0bd72"/>
      <stop offset="1" stop-color="#c9883a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(35 256 256)">
    <ellipse cx="256" cy="256" rx="104" ry="150" fill="url(#bean)"/>
    <path d="M256 112 C 214 176, 298 226, 256 256 S 214 336, 256 400"
          fill="none" stroke="#3a2412" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
